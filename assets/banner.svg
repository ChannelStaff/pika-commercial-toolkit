<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="50%" style="stop-color:#0d1424"/>
      <stop offset="100%" style="stop-color:#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#1a2a4a;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" style="stop-color:#162244;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a4a7f;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#4a7abf;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#2a4a7f;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a7abf;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#6a9adf;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4a7abf;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#8ab4f8">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="360" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="360" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="360" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="120" cy="80" r="60" fill="none" stroke="#4a7abf" stroke-width="1" opacity="0.12"/>
  <circle cx="120" cy="80" r="100" fill="none" stroke="#4a7abf" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1080" cy="280" r="70" fill="none" stroke="#4a7abf" stroke-width="1" opacity="0.12"/>
  <circle cx="1080" cy="280" r="110" fill="none" stroke="#4a7abf" stroke-width="0.5" opacity="0.08"/>
  <circle cx="950" cy="60" r="30" fill="none" stroke="#6a9adf" stroke-width="0.8" opacity="0.1"/>
  <circle cx="250" cy="300" r="25" fill="none" stroke="#6a9adf" stroke-width="0.8" opacity="0.08"/>

  <!-- Decorative paths -->
  <path d="M0 200 Q 300 160 600 200 T 1200 190" fill="none" stroke="#4a7abf" stroke-width="0.8" opacity="0.08"/>
  <path d="M0 230 Q 400 270 700 230 T 1200 240" fill="none" stroke="#4a7abf" stroke-width="0.6" opacity="0.06"/>

  <!-- Small decorative dots -->
  <circle cx="180" cy="140" r="2" fill="#4a7abf" opacity="0.2"/>
  <circle cx="320" cy="90" r="1.5" fill="#6a9adf" opacity="0.15"/>
  <circle cx="760" cy="260" r="2" fill="#4a7abf" opacity="0.2"/>
  <circle cx="900" cy="130" r="1.5" fill="#6a9adf" opacity="0.15"/>
  <circle cx="1050" cy="180" r="2" fill="#4a7abf" opacity="0.18"/>
  <circle cx="500" cy="280" r="1.5" fill="#6a9adf" opacity="0.12"/>
  <circle cx="680" cy="100" r="2" fill="#4a7abf" opacity="0.15"/>
  <circle cx="140" cy="250" r="1.5" fill="#6a9adf" opacity="0.12"/>

  <!-- Accent line above headline -->
  <rect x="400" y="118" width="400" height="2" fill="url(#lineGlow)" opacity="0.5"/>

  <!-- Headline -->
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="bold" fill="#ffffff">
    Pika 3.5 Commercial
    <tspan x="600" dy="60">Bypass Tool</tspan>
  </text>

  <!-- Accent line below headline -->
  <rect x="450" y="258" width="300" height="1.5" fill="url(#lineGlow)" opacity="0.4"/>

  <!-- Tagline -->
  <text x="600" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    Lightweight helper for video teams using Pika 3.5 — manage
    <tspan x="600" dy="28">commercial licensing flags and export metadata in…</tspan>
  </text>
</svg>